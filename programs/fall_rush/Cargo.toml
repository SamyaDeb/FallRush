[package]
name = "fall_rush"
version = "0.1.0"
description = "Fall Rush match lifecycle on MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fall_rush"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Pins the VRF queue to DEFAULT_EPHEMERAL_TEST_QUEUE (local MagicBlock stack) instead of
# DEFAULT_EPHEMERAL_QUEUE (devnet/mainnet ER). Build with: anchor build -- --features localnet
localnet = []

[dependencies]
anchor-lang = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
# sha256 for caller seed / transcript / deal (anchor-lang 1.0.2 no longer re-exports `hash`);
# same version the SDK already pulls in (magicblock-delegation-program-api 3.1.0).
solana-sha256-hasher = { version = "=3.1.0" }
# P2: the game simulation (integer, no_std, zero deps); the program is its authority.
rush-core = { path = "../../crates/rush-core" }
# P2: hand-built ScheduleTask / CancelTask CPI to the Magic program, exactly as P0 §4.3 measured it.
magicblock-magic-program-api = { version = "=0.10.1", default-features = false }
bincode = { version = "=1.3.3" }
# zero-copy account views in the never-failing tick (same version Anchor already pulls in).
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
# P2: session keys for join_lobby / submit_input (doc 19: session-keys 3.1.1, SessionTokenV2); CPI types only.
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
