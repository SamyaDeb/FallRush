# M1 local stack: Unity dedicated server (linux/amd64) + nginx 1.24 TLS edge.
#   pnpm m1:up    (generates a self-signed localhost cert into $M1_CERT_DIR, default ./.m1-certs, never committed)
#   pnpm m1:down
# On Apple Silicon the Mono Linux server cannot run under emulation (see docs/proof/M1-transport.md):
#   pnpm m1:up:mac   → native Mac dev server on 127.0.0.1:7777 + only the nginx service (proxying to the host)
name: fallrush-m1

services:
  gameserver:
    build:
      context: ../client-unity/Builds/Server
      dockerfile: ../../../infra/gameserver.Dockerfile
    image: fallrush-gameserver:m1
    platform: linux/amd64
    environment:
      GAMESERVER_PORT: "7777"
      GAMESERVER_ID: gs-local
    ports:
      - "127.0.0.1:7777:7777"   # plain ws for the http://localhost:8080 test
    cpus: 0.75                  # same cap as planned on the VPS (doc 13 §2)
    mem_limit: 1g
    restart: "no"

  nginx:
    image: nginx:1.24.0
    depends_on:
      - gameserver
    environment:
      GAMESERVER_UPSTREAM: ${GAMESERVER_UPSTREAM:-gameserver:7777}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    volumes:
      - ../client-unity/Builds/WebGL:/usr/share/nginx/html:ro
      - ./nginx/fallrush-m1.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/fallrush-webgl.inc:/etc/nginx/fallrush-webgl.inc:ro
      - ${M1_CERT_DIR:-../.m1-certs}:/etc/nginx/certs:ro
    restart: "no"
