# Host nginx (shared VPS): Fall Rush P5 server blocks only (sites-available/fallrush-p5.conf + symlink). <PLAY_HOST>,
# <GS1_HOST>, <GS2_HOST> = play./gs1./gs2.<VPS_IP-dashed>.sslip.io, substituted at deploy (never committed).
# certbot --nginx adds the TLS lines per name. WebSocket proxying per doc 13 (unique map variable name).
map $http_upgrade $fallrush_p5_connection_upgrade { default upgrade; '' close; }
# fallrush.fun front Worker (web/front-worker): trust its client-IP header only with the shared secret, so the per-IP
# guest gas / faucet limits see the visitor, not Cloudflare. <FRONT_KEY> = ~/.config/fall-rush/front.env (never committed);
# a regex entry because a 48-char exact key overflows map_hash_bucket_size.
map $http_x_fallrush_front $fallrush_front_ok { "~^<FRONT_KEY>$" 1; default 0; }
map "$fallrush_front_ok|$http_x_fallrush_client_ip" $fallrush_client_ip { "~^1\|(?<fr_cip>[0-9a-fA-F:.]+)$" $fr_cip; default $remote_addr; }
server {
  listen 80; listen [::]:80;
  server_name <PLAY_HOST>;
  client_max_body_size 1m;
  location / { proxy_pass http://127.0.0.1:3110; proxy_set_header Host $host; proxy_set_header X-Real-IP $fallrush_client_ip; proxy_read_timeout 60s; }
}
server {
  listen 80; listen [::]:80;
  server_name <GS1_HOST>;
  location / { proxy_pass http://127.0.0.1:7777; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $fallrush_p5_connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
}
server {
  listen 80; listen [::]:80;
  server_name <GS2_HOST>;
  location / { proxy_pass http://127.0.0.1:7778; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $fallrush_p5_connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
}
