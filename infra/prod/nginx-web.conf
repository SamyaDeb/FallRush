# fallrush-web (nginx:alpine in the container): the landing (web/site → /srv/web/site: `/`, /join, /privacy and its
# /site-assets, /models, /sfx), the game app (web/app: /play, /live, /replay, /receipt, /me, /arenas; every other route →
# its index.html), the Unity WebGL build under /unity with Unity's pre-compressed Brotli files (no brotli module;
# Decompression Fallback off), /api → the indexer.
server {
  listen 80;
  root /srv/web;
  index index.html;
  location = /healthz { return 200 "ok\n"; }
  # re-resolve the indexer through Docker's DNS (a recreated container gets a new IP; a static upstream 502s)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $fallrush_indexer http://fallrush-indexer:3112;
  location /api/ { proxy_pass $fallrush_indexer; proxy_set_header X-Real-IP $http_x_real_ip; proxy_read_timeout 60s; }
  # the landing's live widgets on the Cloudflare copy (waitlist.fallrush.fun) read these two GETs cross-origin
  location ~ ^/api/(status|matches)$ {
    add_header Access-Control-Allow-Origin "https://waitlist.fallrush.fun" always;
    add_header Vary Origin always;
    proxy_pass $fallrush_indexer; proxy_set_header X-Real-IP $http_x_real_ip; proxy_read_timeout 60s;
  }
  # the landing (web/site)
  location = / { root /srv/web/site; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location ~ ^/(join|privacy)/?$ { root /srv/web/site; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location ^~ /site-assets/ { root /srv/web/site; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~ ^/(models|sfx)/ { root /srv/web/site; add_header Cache-Control "public, max-age=86400"; }
  location ~ ^/(og-default\.png|favicon\.png|robots\.txt)$ { root /srv/web/site; }
  location ~ ^/unity/.+\.(data|symbols\.json)\.br$ { gzip off; add_header Content-Encoding br; default_type application/octet-stream; add_header Cache-Control "public, max-age=3600"; }
  location ~ ^/unity/.+\.js\.br$ { gzip off; add_header Content-Encoding br; default_type application/javascript; add_header Cache-Control "public, max-age=3600"; }
  location ~ ^/unity/.+\.wasm\.br$ { gzip off; add_header Content-Encoding br; default_type application/wasm; add_header Cache-Control "public, max-age=3600"; }
  # Decompression Fallback build: .unityweb = Brotli bytes served plain (no Content-Encoding) so /play can fetch them
  # in parallel Range requests; Unity's loader decodes them
  location ~ ^/unity/.+\.unityweb$ { gzip off; default_type application/octet-stream; add_header Cache-Control "public, max-age=3600"; }
  location ~ \.wasm$ { default_type application/wasm; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
  gzip on; gzip_types application/javascript application/json text/css application/wasm;
}
