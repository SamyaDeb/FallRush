# Fall Rush M1 local edge (nginx 1.24, same server-block shape reused on the VPS, doc 13 §2).
#   http://localhost:8080   static WebGL; the page connects ws://localhost:7777 straight to the container
#   https://localhost:8443  static WebGL + WebSocket upgrade on "/" proxied to gameserver:7777 (same origin)
#   https://localhost:8444  WebSocket-only block → gameserver:7777 (shape of gs1.<domain> in production)
# WebSocket proxying per https://nginx.org/en/docs/http/websocket.html

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fallrush_gameserver {
    server gameserver:7777;
}

server {
    listen 8080;
    server_name localhost;
    include /etc/nginx/fallrush-webgl.inc;
}

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    include /etc/nginx/fallrush-webgl.inc;

    # UTP's WebSocket server only accepts its configured path ("/") with an HTTP/1.1 upgrade.
    # Same origin: GET / with "Upgrade: websocket" goes to the game server, everything else is static.
    # Only "return" inside "if" (the documented-safe use); the upgrade is handled in a named location.
    location = / {
        error_page 418 = @gameserver_ws;
        if ($http_upgrade ~* "^websocket$") {
            return 418;
        }
        try_files /index.html =404;
    }

    location @gameserver_ws {
        proxy_pass http://fallrush_gameserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 8444 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    location / {
        proxy_pass http://fallrush_gameserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
