# Fall Rush game server 1 on the shared VPS (M2b gate). One file; <GS1_HOST> is substituted at deploy time
# (gs1.<VPS_IP>.sslip.io, never committed). Reuses the existing Let's Encrypt certificate issued in M1 §4.7.
# WebSocket proxying per https://nginx.org/en/docs/http/websocket.html; unique map variable (no clash with other sites).
map $http_upgrade $fallrush_gs1_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <GS1_HOST>;

    ssl_certificate     /etc/letsencrypt/live/<GS1_HOST>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<GS1_HOST>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fallrush_gs1_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
