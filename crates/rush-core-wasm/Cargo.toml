[package]
name = "rush-core-wasm"
description = "rush-core for the browser: a C-ABI cdylib (no wasm-bindgen)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
# P6 D-CROWN harness only (tools/p6/crown-harness.ts): `rc_bot_input`. The shipped rush_core.wasm is built without it.
harness = []

[dependencies]
rush-core = { path = "../rush-core" }
sha2 = { version = "=0.10.9", default-features = false }
