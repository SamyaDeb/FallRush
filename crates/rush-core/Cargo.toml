[package]
name = "rush-core"
description = "Fall Rush game simulation: integer-only, no_std, no allocation. Compiled to sBPF (authority) and WASM (prediction)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Per-tick work counters (narrowphase tests, sweep sub-steps, slides, TOI bisections, bot raycasts) for CU pricing.
counters = []
# Off-chain map blob builder (uses `alloc`; never compiled into the program).
builder = []

# Zero runtime dependencies (P1 prompt §1.2). Dev-deps are pinned and justified in docs/proof/P1-rush-core.md §3.
[dependencies]

[dev-dependencies]
sha2 = "=0.10.9"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
