[package]
name = "rush-core-sbf-check"
description = "Minimal Solana program running rush-core vectors on sBPF; returns the hash via return data."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
no-entrypoint = []

[dependencies]
rush-core = { path = "../rush-core" }
solana-program = "=3.0.0"

[dev-dependencies]
litesvm = { version = "=0.9.1", features = ["register-tracing"] } # register-tracing: P2 0.2 sBPF profile (tests/prof.rs)
solana-compute-budget = "=3.1.14"
solana-sdk = "3"
